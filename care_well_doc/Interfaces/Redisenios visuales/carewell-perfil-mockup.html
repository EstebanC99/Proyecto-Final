<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>CareWell</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--pri:#00897B;--pri-d:#00695C;--pri-s:#E0F2F0;--ink:#212121;--ink-2:#757575;
        --bg:#F4F7F6;--line:#E5EAE6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',system-ui,sans-serif;background:#DDE5E3;color:var(--ink);display:flex;justify-content:center;padding:24px 12px}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:32px;overflow:hidden;position:relative;
         box-shadow:0 24px 60px rgba(0,60,55,.25);padding-bottom:26px}
  .status{display:flex;justify-content:space-between;padding:13px 22px 6px;font-size:12.5px;font-weight:500;color:#4A4A4A;background:#FFF}
  .appbar{display:flex;align-items:center;gap:10px;padding:4px 14px 14px;background:#FFF}
  .back{font-size:20px;width:26px;text-align:center}
  .ctx{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px;
      background:linear-gradient(150deg,#FFE2BC,#F3C285);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--pri)}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#9E9E9E}
  .nmrow{display:flex;align-items:center;gap:7px;margin-top:1px;min-width:0}
  .nm{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rel{background:var(--pri-s);color:var(--pri-d);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;flex:none}
  .cv{color:var(--pri);font-size:12px}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .an{animation:up .4s cubic-bezier(.2,.7,.3,1) both}
  .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}

  .hero{background:linear-gradient(160deg,#00A392 0%,#00796B 60%,#00625A 100%);padding:22px 20px 46px;
        position:relative;overflow:hidden;text-align:center}
  .hero:before{content:'';position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero:after{content:'';position:absolute;left:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.05)}
  .htop{display:flex;align-items:center;position:relative;color:#fff}
  .htop .t{font-size:17px;font-weight:500;margin-left:12px}
  .htop .ed{margin-left:auto;background:rgba(255,255,255,.18);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
  .pav{width:92px;height:92px;border-radius:50%;margin:16px auto 0;position:relative;
       background:linear-gradient(150deg,#BBDDD6,#7FB5AB);display:grid;place-items:center;
       font-size:30px;font-weight:700;color:#00544A;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
  .cam{position:absolute;right:-2px;bottom:-2px;width:29px;height:29px;border-radius:50%;background:#fff;
       display:grid;place-items:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .pname{color:#fff;font-size:21px;font-weight:700;letter-spacing:-.4px;margin-top:13px;position:relative}
  .prole{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);color:#fff;
         border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;margin-top:8px;position:relative}

  .stats{display:flex;margin:-30px 16px 0;background:#FFF;border-radius:16px;box-shadow:0 3px 12px rgba(0,60,55,.1);
         padding:14px 6px;position:relative}
  .st{flex:1;text-align:center}
  .st b{display:block;font-size:19px;font-weight:700;color:var(--pri-d)}
  .st span{font-size:11px;color:var(--ink-2)}
  .st+.st{border-left:1px solid var(--line)}

  .lab{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9AA5A0;padding:22px 20px 9px}
  .grp{background:#FFF;border-radius:16px;margin:0 16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .row{display:flex;align-items:center;gap:13px;padding:14px;border-bottom:1px solid #F1F4F3}
  .row:last-child{border-bottom:0}
  .ic{width:38px;height:38px;border-radius:12px;background:var(--pri-s);display:grid;place-items:center;font-size:16px;flex:none}
  .rt{flex:1;min-width:0}
  .rt .k{font-size:11.5px;color:#9AA5A0;font-weight:500}
  .rt .v{font-size:14.5px;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act{font-size:16px;color:#C4CDCA}
</style></head><body><div class="phone">
  <div class="status" style="background:transparent"><span style="color:#fff">15:23</span><span style="color:#fff">&#9679;&#9679;&#9679;&nbsp;&#9679;&#9679;</span></div>
  <div class="hero">
    <div class="htop"><div style="font-size:19px">&#8592;</div><div class="t">Mi perfil</div><div class="ed">&#9998;</div></div>
    <div class="pav">EC<div class="cam">&#128247;</div></div>
    <div class="pname">Esteban Agustín Carignani</div>
    <div class="prole">&#128081; Responsable</div>
  </div>

  <div class="stats an">
    <div class="st"><b>3</b><span>A cargo</span></div>
    <div class="st"><b>26</b><span>Años</span></div>
  </div>

  <div class="lab an d1">Datos de contacto</div>
  <div class="grp an d1">
    <div class="row"><div class="ic">&#9993;</div><div class="rt"><div class="k">Email</div><div class="v">estebancarignani99@gmail.com</div></div><div class="act">&#9998;</div></div>
    <div class="row"><div class="ic">&#128222;</div><div class="rt"><div class="k">Teléfono</div><div class="v">336 456-2256</div></div><div class="act">&#9998;</div></div>
  </div>

  <div class="lab an d2">Identificación</div>
  <div class="grp an d2">
    <div class="row"><div class="ic">&#127380;</div><div class="rt"><div class="k">DNI</div><div class="v">41.567.829</div></div></div>
  </div>

  <div style="height:22px"></div>
</div></body></html>
