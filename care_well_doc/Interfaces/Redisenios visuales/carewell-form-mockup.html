<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>CareWell</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--pri:#00897B;--pri-d:#00695C;--pri-s:#E0F2F0;--ink:#212121;--ink-2:#757575;
        --bg:#F4F7F6;--line:#E5EAE6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',system-ui,sans-serif;background:#DDE5E3;color:var(--ink);display:flex;justify-content:center;padding:24px 12px}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:32px;overflow:hidden;position:relative;
         box-shadow:0 24px 60px rgba(0,60,55,.25);padding-bottom:26px}
  .status{display:flex;justify-content:space-between;padding:13px 22px 6px;font-size:12.5px;font-weight:500;color:#4A4A4A;background:#FFF}
  .appbar{display:flex;align-items:center;gap:10px;padding:4px 14px 14px;background:#FFF}
  .back{font-size:20px;width:26px;text-align:center}
  .ctx{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px;
      background:linear-gradient(150deg,#FFE2BC,#F3C285);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--pri)}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#9E9E9E}
  .nmrow{display:flex;align-items:center;gap:7px;margin-top:1px;min-width:0}
  .nm{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rel{background:var(--pri-s);color:var(--pri-d);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;flex:none}
  .cv{color:var(--pri);font-size:12px}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .an{animation:up .4s cubic-bezier(.2,.7,.3,1) both}
  .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}

  .lab{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#9AA5A0;padding:20px 20px 10px}
  .lab i{color:#C0392B;font-style:normal}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 16px}
  .t{background:#FFF;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
  .t .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:#F2F5F4}
  .t .n{font-size:13.5px;font-weight:500}
  .t.on{border-color:var(--pri);background:var(--pri-s)}
  .t.on .i{background:#FFF}
  .t.on .n{font-weight:700;color:var(--pri-d)}
  .fld{margin:0 16px;background:#FFF;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;color:#B3BDB9;min-height:92px}
  .cnt{text-align:right;font-size:11.5px;color:#B3BDB9;margin:6px 20px 0}
  .duo{display:flex;gap:10px;margin:0 16px}
  .in{flex:1;background:#FFF;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:500}
  .in span:first-child{font-size:15px}
  .in .ed{margin-left:auto;font-size:11px;color:var(--pri);font-weight:700}
  .bar{position:absolute;left:0;right:0;bottom:0;background:#FFF;border-top:1px solid var(--line);padding:14px 16px 20px}
  .cta{background:var(--pri);color:#fff;border-radius:14px;padding:16px;text-align:center;font-size:16px;font-weight:700;
       box-shadow:0 6px 16px rgba(0,137,123,.3)}
  .hint{text-align:center;font-size:11.5px;color:#9AA5A0;margin-top:9px}
</style></head><body><div class="phone" style="padding-bottom:110px">
  <div class="status"><span>15:22</span><span>&#9679;&#9679;&#9679;&nbsp;&#9679;&#9679;</span></div>
  <div class="appbar">
    <div class="back">&#8592;</div>
    <div class="ctx"><div class="av">&#128021;</div>
      <div style="min-width:0"><div class="eyebrow">Nuevo evento de salud</div>
      <div class="nmrow"><span class="nm">Thor Eto</span><span class="rel">MASCOTA</span></div></div>
    </div>
  </div>

  <div class="lab an">Tipo de evento <i>*</i></div>
  <div class="tiles an">
    <div class="t on"><div class="i">&#129658;</div><div class="n">Cita médica</div></div>
    <div class="t"><div class="i">&#128138;</div><div class="n">Medicación</div></div>
    <div class="t"><div class="i">&#129370;</div><div class="n">Rehabilitación</div></div>
    <div class="t"><div class="i">&#128203;</div><div class="n">Control</div></div>
    <div class="t"><div class="i">&#127973;</div><div class="n">Síntoma</div></div>
    <div class="t"><div class="i">&#10133;</div><div class="n">Otro</div></div>
  </div>

  <div class="lab an d1">Descripción <i>*</i></div>
  <div class="fld an d1">Ej. Control anual con el veterinario</div>
  <div class="cnt an d1">0 / 500</div>

  <div class="lab an d2">Cuándo ocurrió</div>
  <div class="duo an d2">
    <div class="in"><span>&#128197;</span><span>Hoy, 17 ago</span><span class="ed">&#9662;</span></div>
    <div class="in"><span>&#128336;</span><span>15:22</span><span class="ed">&#9662;</span></div>
  </div>

  <div class="bar">
    <div class="cta">Registrar evento</div>
    <div class="hint">Completá la descripción para continuar</div>
  </div>
</div></body></html>
